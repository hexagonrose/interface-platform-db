name: Validate and publish database
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 build_surface.py "${{ runner.temp }}/site"
      - run: |
          python3 -m venv "${{ runner.temp }}/browser"
          "${{ runner.temp }}/browser/bin/pip" install playwright==1.56.0
          INTERFACE_CHROMIUM="$(command -v google-chrome)" "${{ runner.temp }}/browser/bin/python" check_surface.py "${{ runner.temp }}/site"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - id: publish
        uses: actions/deploy-pages@v4
