<main><h1>계면 만들기</h1>
<p class="intro">표면 DB에 있는 완화 슬랩 두 개를 골라 격자를 맞춘 계면 초기 구조를 만듭니다. 에너지는 계산하지 않으며, 같은 면 조합의 DB 계산이 있으면 함께 표시합니다.</p>
<div class="pairs" id="pairs" role="group" aria-label="물질 쌍"></div>

const canvas=$('canvas'),ctx=canvas.getContext('2d');

 const rad=Math.max(1.6,Math.min(12,sc*.8));g.positions.map((p,i)=>({p:P(p),s:g.symbols[i]})).sort((a,b)=>a.p[2]-b.p[2]).forEach(({p,s})=>{const col=atomColors[s]||'#888888',gr=ctx.createRadialGradient(p[0]-rad*.32,p[1]-rad*.38,rad*.04,p[0],p[1],rad);gr.addColorStop(0,'#fff');gr.addColorStop(.25,shade(col,1.2));gr.addColorStop(.65,col);gr.addColorStop(1,shade(col,.4));ctx.beginPath();ctx.arc(p[0],p[1],rad,0,2*Math.PI);ctx.fillStyle=gr;ctx.fill();ctx.strokeStyle=shade(col,.45);ctx.lineWidth=.5;ctx.stroke()});
 const ox=box.width-56,oy=box.height-48;ctx.font='600 13px system-ui';[[[1,0,0],'X','#de6c68'],[[0,1,0],'Y','#70ac78'],[[0,0,1],'Z','#6d9de1']].map(([q,l,c])=>({q:rotatePoint(q),l,c})).sort((a,b)=>a.q[2]-b.q[2]).forEach(({q,l,c})=>{const x=ox+q[0]*34,y=oy-q[1]*34;ctx.strokeStyle=c;ctx.fillStyle=c;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(ox,oy);ctx.lineTo(x,y);ctx.stroke();ctx.fillText(l,x+4,y-4)})}
const mark=n=>document.querySelectorAll('[data-angle]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.angle===n)));

canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!drag)return;mark(null);angle[0]+=(e.clientX-drag[0])*.01;angle[1]+=(e.clientY-drag[1])*.01;drag=[e.clientX,e.clientY];draw()};canvas.onpointerup=canvas.onpointercancel=()=>drag=null;
