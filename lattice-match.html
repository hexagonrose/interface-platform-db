const el=id=>document.getElementById(id);
let selected=3;
const circle=(x,y,r,color)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${color}"/>`;
function drawCell(){
 const d=data[selected], t=Number(el('progress').value)/100, factor=1+d.strain*t/100;
 const corners=[...d.outline,...d.film], xs=corners.map(p=>p[0]), ys=corners.map(p=>p[1]);
 const left=Math.min(...xs),right=Math.max(...xs),top=Math.max(...ys),bottom=Math.min(...ys);
 const scale=Math.min(390/(right-left),230/(top-bottom));
 const pos=(p,f)=>[240+(p[0]*f-(left+right)/2)*scale,150-(p[1]*f-(top+bottom)/2)*scale];
 function layer(sites,hull,f,color,dash){
  const path=hull.map(p=>pos(p,f).join(',')).join(' ');
  return `<polygon points="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-dasharray="${dash}"/>`+sites.map(p=>circle(...pos(p,f),dash?3:4.6,color)).join('');
 }
 el('cell').innerHTML=layer(d.al,d.outline,1,'var(--al)','')+layer(d.zn,d.film,factor,'var(--zn)','6 4');
 el('amount').value=Math.round(t*100)+'%';
 const gap=Math.hypot(...d.film[1])*(1-t)*Math.abs(d.strain)/100;
 el('gap').textContent='첫 번째 초격자 벡터의 끝점 간 거리  '+gap.toFixed(3)+' Å';
}
function drawPlot(){

 for(const n of [200,400,600,800,1000])svg+=`<text x="${x(n)}" y="182" text-anchor="middle" font-size="11">${n}</text>`;

 [...el('choices').children].forEach((b,j)=>b.setAttribute('aria-pressed',i===j));drawCell();drawPlot();
