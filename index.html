function filter(){const active=['solute','quality'].filter(id=>$(id).value).length;$('filter-count').textContent=active?'('+active+')':'';const q=normalized($('query').value.trim());filtered=DB.records.filter(r=>r.kind===category&&[...selectedElements].every(symbol=>elementsOf(r).has(symbol))&&(!$('material').value||r.materials.includes($('material').value))&&(!$('property').value||r.property===$('property').value)&&(!$('quality').value||r.quality===$('quality').value)&&(!$('host').value||hostOf(r)===$('host').value)&&(!$('solute').value||soluteOf(r)===$('solute').value)&&normalized([r.title,r.id,...r.materials,...new Set(r.geometry?.symbols||[])].join(' ')).includes(q));

function select(id){entry=filtered.find(r=>r.id===id)||null;$('record-json').disabled=!entry;$('structure').disabled=!entry?.geometry;$('structure').hidden=!!entry&&!entry.geometry;$('empty').hidden=!!(entry?.shape||entry?.geometry);$('empty').textContent=entry?'원자 구조 미수록':'자료를 선택해 주세요.';document.querySelectorAll('[data-angle]').forEach(b=>b.disabled=!(entry?.shape||entry?.geometry));$('record-picker').value=id||'';angle=[-.6,.35];zoom=1;markAngle('iso');

 try{history.replaceState(null,'','#'+entry.id)}catch{}$('title').textContent=entry.title;$('model').textContent=`${entry.provenance.model} / ${entry.provenance.modal.toUpperCase()} · ${entry.date||'계산일 미확인'}`;

 $('run-summary').innerHTML=run?`<div class="run-summary"><strong>자동 생성·MLIP 계산 → 검증 → DB 반영</strong><div>실행 자료: <code>${esc(entry.provenance.dataset)}</code></div><div>원자·셀 완화 수렴: ${entry.conditions.optimizer_and_cell_convergence_verified?'확인':'미확인'} · 저장 원자 힘: ${entry.conditions.stored_atomic_forces_pass?'기준 충족':'미확인'}</div><div>입력·실행 코드·모델·구조 해시 보관 · DFT 검증 미수행</div></div>`:'';
 $('legend').innerHTML=entry.kind==='surface'?entry.surfaces.map(s=>`<span><i style="background:${faceColors[s.facet]||'#799585'}"></i>(${s.facet})</span>`).join(''):[...new Set(entry.geometry?.symbols||[])].map(symbol=>`<span><i class="${entry.kind==='solute'&&symbol===soluteOf(entry)?'solute-key':''}" style="background:${atomColors[symbol]||'#888'}"></i>${esc(symbol)}${entry.kind==='solute'&&symbol===soluteOf(entry)?' · 첨가 원소':''}</span>`).join('');
 $('metrics').dataset.resultKind=entry.kind;
 const related=DB.records.filter(r=>r.comparison_group===entry.comparison_group&&r.property===entry.property);
 $('metrics').innerHTML=entry.kind==='surface'?`<h2>방향별 표면에너지</h2><div class="scroll"><table><thead><tr><th>면</th><th>γ (J/m²)</th><th>면적 비율</th><th>최대 힘 (eV/Å)</th></tr></thead><tbody>${entry.surfaces.map(s=>`<tr><td><i class="facet-key" aria-hidden="true" style="background:${faceColors[s.facet]||'#799585'}"></i>(${s.facet})</td><td>${num(s.gamma_J_m2)}</td><td>${num(s.area_fraction*100,1)}%</td><td>${num(s.fmax_eV_A)}</td></tr>`).join('')}</tbody></table></div>`:entry.kind==='solute'?soluteComparison(related):entry.property==='work_of_adhesion'&&related.length>1?`<h2>동일 조건의 접합일 비교</h2><div class="scroll"><table><thead><tr><th>이동 · 공통셀 분율</th><th>접합일 (J/m²)</th></tr></thead><tbody>${related.map(r=>`<tr class="${r.id===entry.id?'selected':''}"><td>${r.conditions.shift_common_cell.map(v=>num(v,3)).join(', ')}</td><td>${num(r.value)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">동일 조건의 비교 자료가 아직 없습니다. 계산 정보에서 이 자료의 기준과 출처를 확인할 수 있습니다.</p>';draw()}
$('metrics').onclick=e=>{const button=e.target.closest('[data-record]');if(button){const id=button.dataset.record;if(filtered.some(r=>r.id===id))select(id);else setCategory(category,id);setView('structure');$('view-structure').focus()}};
for(const id of filterIds)$(id).addEventListener('input',filter);$('reset').onclick=()=>{selectedElements.clear();for(const id of filterIds)$(id).value='';filter()};window.addEventListener('hashchange',()=>{const row=DB.records.find(r=>r.id===decodeURIComponent(location.hash.slice(1)));if(row)setCategory(row.kind,row.id);else filter()});
function soluteComparison(related){const rows=related.filter(r=>hostOf(r)===hostOf(entry)&&r.provenance.model===entry.provenance.model&&r.provenance.modal===entry.provenance.modal).sort((a,b)=>a.value-b.value);return `<h2>같은 조건 비교</h2><p class="muted">${esc(hostOf(entry))} 모재 · ${entry.conditions?.workflow_run_id?'신규 실행 '+esc(entry.date)+' · 셀 고정':'기존 결과 · 체크포인트 미확인'} · 에너지순</p><p class="muted">기준: 모재 벌크 + 첨가 원소 단체 · ${entry.conditions.atoms}원자 중 ${entry.conditions.solute_count}개 치환</p><div class="scroll"><table><thead><tr><th>첨가 원소</th><th>형성에너지 (eV)</th></tr></thead><tbody>${rows.map(r=>`<tr class="${r.id===entry.id?'selected':''}"><td><button data-record="${esc(r.id)}">${esc(soluteOf(r))}</button></td><td>${num(r.value)}</td></tr>`).join('')}</tbody></table></div>`}
function setView(name){
 document.querySelectorAll('[data-view]').forEach(b=>{const active=b.dataset.view===name;b.setAttribute('aria-selected',String(active));b.tabIndex=active?0:-1;$(b.getAttribute('aria-controls')).hidden=!active});draw();
}
for(const button of document.querySelectorAll('[data-view]')){
 button.onclick=()=>setView(button.dataset.view);
 button.onkeydown=e=>{const tabs=[...document.querySelectorAll('[data-view]')],i=tabs.indexOf(button);let next;if(e.key==='ArrowRight')next=(i+1)%tabs.length;else if(e.key==='ArrowLeft')next=(i+tabs.length-1)%tabs.length;else if(e.key==='Home')next=0;else if(e.key==='End')next=tabs.length-1;else return;e.preventDefault();tabs[next].click();tabs[next].focus()};
}
function download(name,text,type='application/json'){const u=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
$('all-json').onclick=()=>download('interface_database.json',JSON.stringify(DB,null,2));$('record-json').onclick=()=>{if(entry)download(entry.id+'.json',JSON.stringify(entry,null,2))};$('structure').onclick=()=>{if(!entry?.geometry)return;const g=entry.geometry;download(entry.id+'.extxyz',`${g.symbols.length}\nLattice="${g.cell.flat().join(' ')}" Properties=species:S:1:pos:R:3 pbc="T T T"\n`+g.positions.map((p,i)=>g.symbols[i]+' '+p.join(' ')).join('\n')+'\n','text/plain')};
$('csv').onclick=()=>{const rows=[['record_id','material','property','facet','value','unit','quality','comparison_group']];for(const r of filtered){if(r.surfaces)for(const s of r.surfaces)rows.push([r.id,r.materials.join('/'),r.property,s.facet,s.gamma_J_m2,r.unit,r.quality,r.comparison_group]);else rows.push([r.id,r.materials.join('/'),r.property,'',r.value,r.unit,r.quality,r.comparison_group])}download('database_selection.csv','\uFEFF'+rows.map(row=>row.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n'),'text/csv;charset=utf-8')};
const canvas=$('canvas'),ctx=canvas.getContext('2d'),atomColors={Cu:'#bc7950',Ni:'#558a6f',Si:'#718ba7',Mn:'#9a7da6',Al:'#769ca8',Zn:'#a5a0b4',Mg:'#739e53',Co:'#bf7791',Cr:'#738abc',Zr:'#b99b58',Sc:'#9e855e'},faceColors={'100':'#d1b16d','110':'#779e93','111':'#497c68','010':'#8caa79','001':'#a6ae75','101':'#8b9faa','011':'#6fa39e','210':'#c2936a','211':'#9c8aab','221':'#819b6c'};
function wrap(g){const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],dot=(a,b)=>a.reduce((s,x,i)=>s+x*b[i],0),[a,b,c]=g.cell,dual=[cross(b,c),cross(c,a),cross(a,b)],det=dot(a,dual[0]);return g.positions.map(p=>{const f=dual.map(v=>((dot(p,v)/det)%1+1)%1);return [0,1,2].map(k=>g.cell.reduce((s,v,j)=>s+f[j]*v[k],0))})}
function draw(){const box=canvas.getBoundingClientRect();if(!box.width)return;const ratio=devicePixelRatio||1;canvas.width=box.width*ratio;canvas.height=box.height*ratio;ctx.scale(ratio,ratio);if(!entry||(!entry.shape&&!entry.geometry))return;
 const shape=entry.shape,g=entry.geometry,points=shape?shape.vertices:wrap(g),cellPoints=shape?[]:Array.from({length:8},(_,i)=>[0,1,2].map(k=>g.cell.reduce((s,v,j)=>s+((i>>j)&1)*v[k],0)));
 const rotate=([x,y,z])=>{const c=Math.cos(angle[0]),s=Math.sin(angle[0]),u=c*x-s*y,v=s*x+c*y;const vertical=Math.sin(angle[1])*v+Math.cos(angle[1])*z,depth=Math.cos(angle[1])*v-Math.sin(angle[1])*z;return entry.kind==='interface'&&box.width>box.height?[vertical,-u,depth]:[u,vertical,depth]};
 const frame=[...points,...cellPoints].map(rotate),lo=[0,1].map(k=>Math.min(...frame.map(p=>p[k]))),hi=[0,1].map(k=>Math.max(...frame.map(p=>p[k]))),center=lo.map((v,k)=>(v+hi[k])/2),scale=.84*Math.min(box.width/Math.max(hi[0]-lo[0],1e-9),box.height/Math.max(hi[1]-lo[1],1e-9))*zoom;
 const project=p=>{const [u,v,d]=rotate(p);return[box.width/2+(u-center[0])*scale,box.height/2-(v-center[1])*scale,d]};
 if(shape){const pp=points.map(project);shape.faces.map(f=>({...f,depth:f.indices.reduce((s,i)=>s+pp[i][2],0)/f.indices.length})).sort((a,b)=>a.depth-b.depth).forEach(f=>{ctx.beginPath();f.indices.forEach((id,i)=>{const p=pp[id];i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])});ctx.closePath();ctx.fillStyle=faceColors[f.family]||'#799585';ctx.fill();ctx.strokeStyle='#f3f6f0';ctx.lineWidth=1;ctx.stroke()})}
 else{const corners=cellPoints.map(project);ctx.strokeStyle='#9cad9d';for(let i=0;i<8;i++)for(const bit of [1,2,4])if(!(i&bit)){ctx.beginPath();ctx.moveTo(...corners[i].slice(0,2));ctx.lineTo(...corners[i|bit].slice(0,2));ctx.stroke()}points.map((p,i)=>({p:project(p),s:g.symbols[i]})).sort((a,b)=>a.p[2]-b.p[2]).forEach(({p,s})=>{ctx.beginPath();ctx.arc(p[0],p[1],Math.max(2.5,Math.min(9,scale*.8))*(entry.kind==='solute'&&s===soluteOf(entry)?1.25:1),0,2*Math.PI);ctx.fillStyle=atomColors[s]||'#888';ctx.fill();const dopant=entry.kind==='solute'&&s===soluteOf(entry);ctx.strokeStyle=dopant?'#20392f':'#fff9';ctx.lineWidth=dopant?2:1;ctx.stroke()})}}
function markAngle(name){document.querySelectorAll('[data-angle]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.angle===name)))}
document.querySelectorAll('[data-angle]').forEach(b=>b.onclick=()=>{angle=b.dataset.angle==='side'?[0,0]:b.dataset.angle==='top'?[0,Math.PI/2]:[-.6,.35];zoom=1;markAngle(b.dataset.angle);draw()});canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!drag)return;markAngle(null);angle[0]+=(e.clientX-drag[0])*.01;angle[1]+=(e.clientY-drag[1])*.01;drag=[e.clientX,e.clientY];draw()};canvas.onpointerup=canvas.onpointercancel=()=>drag=null;canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.4,Math.min(3,zoom*Math.exp(-e.deltaY*.001)));draw()},{passive:false});new ResizeObserver(draw).observe(canvas);const initial=DB.records.find(r=>r.id===decodeURIComponent(location.hash.slice(1)));setCategory(initial?.kind||'interface',initial?.id);setView('structure');
</script></body></html>
